# End-to-end pipeline job for the job-embedding-showcase.
#
# One sequential serverless DAG (each task runs on serverless compute by
# omitting cluster fields). The chain runs at most one task at a time, so it
# trivially stays under the Free Edition <=5 concurrent-task limit even
# though it declares more than five tasks total.
#
# Task order:
#   setup_catalog
#     -> load_reference_data
#     -> ingest_listings
#     -> enrich_listings
#     -> sync_vector_index
#     -> create_uc_functions
#     -> register_deploy_agent
#
# run_evaluation is deliberately independent (no depends_on): it is meant to
# be triggered on demand ahead of promoting a new matching_agent version.
resources:
  jobs:
    job_pipeline:
      name: "[${bundle.target}] job-embedding-showcase pipeline"
      max_concurrent_runs: 1
      queue:
        enabled: true
      # Run the full ingest→enrich→index→deploy chain once a day so the map and
      # the matching corpus pick up fresh Bundesagentur für Arbeit postings.
      # Quartz cron (seconds minutes hours day-of-month month day-of-week):
      # 04:00 every day, Europe/Berlin. UNPAUSED so the corpus refreshes daily.
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: "Europe/Berlin"
        pause_status: UNPAUSED
      tags:
        project: databricks-job-agent
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: warehouse_id
          default: ${var.sql_warehouse_id}
        - name: vs_endpoint_name
          default: ${var.vs_endpoint_name}
        - name: matching_agent_endpoint_name
          default: ${var.matching_agent_endpoint_name}
        # Pages per search query fetched from the Jobsuche API (size=500, API
        # window caps page*size at 10 000 → max 20 pages/query).
        - name: max_pages
          default: "20"
        # Total unique listings to ingest before stopping. The LLM-derived
        # "vibe" filters (company_vibe/office_policy/benefits_rating) need the
        # job description text to be meaningful, and descriptions are fetched
        # one-HTTP-call-per-listing (see fetch_descriptions), so this is capped
        # to a few thousand to stay within the ingest task timeout while still
        # giving the map good density and the filters real, varied values.
        - name: max_records
          default: "10000"
        # "true" fetches each listing's description so the enrichment LLM has
        # real text to infer skills/seniority AND the vibe attributes from.
        # (Set to "false" for a fast, description-less pull when only map
        # density matters.)
        - name: fetch_descriptions
          default: "true"

      # Serverless environments providing the PyPI dependencies that specific
      # notebooks import (not present in the default serverless runtime).
      # Versions are pinned to keep pip's resolver from exploring too large a
      # search space (ResolutionTooDeep). Kept minimal: notebook 06 only runs
      # spark.sql(CREATE FUNCTION ...) — the databricks.vector_search import in
      # its function body executes server-side in UC, so task 06 needs no
      # extra environment.
      environments:
        - environment_key: vs_env
          spec:
            environment_version: "2"
            dependencies:
              - databricks-vectorsearch==0.75
        - environment_key: agent_env
          spec:
            environment_version: "2"
            # build_agent() and MatchingAgent now depend only on mlflow and the
            # databricks SDK (both in the serverless base). mlflow is pinned so
            # log_model/registration behaviour is reproducible. No langchain: the
            # agent calls the gold.* UC functions directly via the SQL warehouse.
            dependencies:
              - mlflow==3.16.0

      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00_setup_catalog.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800
          max_retries: 1

        - task_key: load_reference_data
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00a_load_reference_data.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800
          max_retries: 1

        - task_key: ingest_listings
          depends_on:
            - task_key: load_reference_data
          notebook_task:
            notebook_path: ../notebooks/02_ingest_listings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              max_pages: "{{job.parameters.max_pages}}"
              max_records: "{{job.parameters.max_records}}"
              fetch_descriptions: "{{job.parameters.fetch_descriptions}}"
          # A 10k pull with a per-listing description detail call is I/O-bound;
          # allow up to ~2.5h so it completes rather than timing out.
          timeout_seconds: 9000
          max_retries: 1

        - task_key: enrich_listings
          depends_on:
            - task_key: ingest_listings
          notebook_task:
            notebook_path: ../notebooks/03_enrich_listings.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          # LLM enrichment of ~10k rows via ai_query batches is the other long
          # step; batches checkpoint so a timeout resumes, but allow ~2.5h.
          timeout_seconds: 9000
          max_retries: 1

        - task_key: sync_vector_index
          depends_on:
            - task_key: enrich_listings
          notebook_task:
            notebook_path: ../notebooks/04_sync_vector_index.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              vs_endpoint_name: "{{job.parameters.vs_endpoint_name}}"
          environment_key: vs_env
          timeout_seconds: 3600
          max_retries: 1

        - task_key: create_uc_functions
          depends_on:
            - task_key: sync_vector_index
          notebook_task:
            notebook_path: ../notebooks/06_create_uc_functions.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              vs_endpoint_name: "{{job.parameters.vs_endpoint_name}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
          timeout_seconds: 1800
          max_retries: 1

        - task_key: register_deploy_agent
          depends_on:
            - task_key: create_uc_functions
          notebook_task:
            notebook_path: ../notebooks/07_register_deploy_agent.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              serving_endpoint_name: "{{job.parameters.matching_agent_endpoint_name}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              require_evaluation_gate: "false"
          environment_key: agent_env
          timeout_seconds: 3600
          max_retries: 0
